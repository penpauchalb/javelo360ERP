<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javelo360 ERP - Enterprise Employee Management System</title>

  <!-- Global Error Logger & Visualizer -->
  <script>
    window.addEventListener('error', function(event) {
      var root = document.getElementById('root') || document.body;
      if (root) {
        root.innerHTML = '<div style="padding: 20px; background: #fff5f5; color: #9b2c2c; border: 1px solid #feb2b2; margin: 20px; font-family: monospace; border-radius: 12px; font-size: 13px; line-height: 1.6; text-align: left;">' +
          '<h3 style="margin-top:0; font-size: 16px; font-weight: bold; color: #e53e3e;">🚨 Javascript Runtime Error</h3>' +
          '<strong>Error Message:</strong> ' + event.message + '<br>' +
          '<strong>File:</strong> ' + event.filename + '<br>' +
          '<strong>Line:</strong> ' + event.lineno + ' : <strong>Col:</strong> ' + event.colno + '<br><br>' +
          '<strong>Stack Trace:</strong><pre style="background: #fff; border: 1px solid #feb2b2; padding: 10px; margin-top: 5px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;">' + (event.error ? event.error.stack : 'No stack trace available') + '</pre>' +
          '</div>';
      }
    });
    window.addEventListener('unhandledrejection', function(event) {
      var root = document.getElementById('root') || document.body;
      if (root) {
        root.innerHTML = '<div style="padding: 20px; background: #fff5f5; color: #9b2c2c; border: 1px solid #feb2b2; margin: 20px; font-family: monospace; border-radius: 12px; font-size: 13px; line-height: 1.6; text-align: left;">' +
          '<h3 style="margin-top:0; font-size: 16px; font-weight: bold; color: #e53e3e;">🚨 Unhandled Promise Rejection</h3>' +
          '<strong>Reason:</strong> ' + String(event.reason) + '<br><br>' +
          '<strong>Stack Trace:</strong><pre style="background: #fff; border: 1px solid #feb2b2; padding: 10px; margin-top: 5px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;">' + (event.reason && event.reason.stack ? event.reason.stack : 'No stack trace available') + '</pre>' +
          '</div>';
      }
    });
  </script>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="./manifest.json?v=32">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Javelo360 ERP">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      console.warn('[PWA] Tailwind CDN offline, fallback styling active.');
    } else {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom Styles (v32) -->
  <link rel="stylesheet" href="./styles.css?v=32">
  
  <!-- Local Self-Contained React 18 & Confetti Bundle -->
  <script src="./react.production.min.js?v=32"></script>
  <script src="./react-dom.production.min.js?v=32"></script>
  <script src="./confetti.browser.min.js?v=32"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <!-- Register PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=32')
          .then(reg => console.log('[PWA] Service Worker updated v32:', reg.scope))
          .catch(err => console.error('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>

  <!-- Native Pure ES6 JavaScript Application (v32) -->
  <script src="./app.js?v=32"></script>
</body>
</html>
